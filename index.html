<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Calculadora de Operações - RutieleES</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <h1>Calculadora Básica</h1>
        <p>Digite os números e escolha a operação:</p>

        <div class="campo-grupo">
            <input type="number" id="num1" placeholder="1º Número">
            <input type="number" id="num2" placeholder="2º Número">
        </div>

        <div class="botoes-operacoes">
            <button class="btn-op" onclick="calcular(1)">1 (+)</button>
            <button class="btn-op" onclick="calcular(2)">2 (-)</button>
            <button class="btn-op" onclick="calcular(3)">3 (/)</button>
            <button class="btn-op" onclick="calcular(4)">4 (*)</button>
        </div>

        <div id="resultado" class="hidden">
            <p id="textoResultado">Aguardando...</p>
        </div>
        
        <button class="btn-limpar" onclick="limpar()">Limpar Campos</button>
    </main>
    <script src="script.js"></script>
</body>
</html>
